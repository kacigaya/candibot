# Copier en config.toml (ignoré par Git) puis compléter.
# Les chemins relatifs partent du dossier de ce fichier.

[candidate]
first_name = "Prénom"
last_name = "NOM"
email = "prenom.nom@example.com"
cv_pdf = "data/cv.pdf"      # 2 Mo max (limite HelloWork)
cv_text = "data/cv.md"      # version texte lue par le modèle pour noter et rédiger
# Précisions reprises dans les lettres. Laisser vide pour ne pas les mentionner.
rhythm = ""                 # alternance seulement, ex. "3 jours en entreprise, 2 jours à l'école"
availability = ""           # ex. "dès maintenant"

[search]
# Sites de recherche, un ou plusieurs parmi : "hellowork", "labonnealternance".
# "labonnealternance" : alternance seulement, réglages dans [labonnealternance].
sites = ["hellowork"]
queries = ["marketing communication", "marketing digital", "communication digitale"]
location = "Île-de-France"
# Types de contrat recherchés, un ou plusieurs parmi : "CDI", "CDD", "Intérim",
# "Stage", "Alternance", "Indépendant", "Freelance", "Franchise", "Associé",
# "Fonctionnaire", "Stage de lycée".
contracts = ["Alternance"]
pages = 2                   # 30 offres par page et par requête
min_score = 7               # note sur 10 en dessous de laquelle l'offre est écartée
max_scored = 40             # offres notées par le modèle à chaque passage
max_applications = 10       # candidatures envoyées par passage avec --send
pause_seconds = [60, 180]   # pause aléatoire entre deux candidatures
# Organismes de formation qui recrutent pour leur propre cursus (surtout en
# alternance et en stage) : écartés sans appel au modèle. Comparaison insensible à la casse, sur une partie du nom.
exclude_companies = [
    "ISCOD", "Digital School of Paris", "AURLOM", "Studi", "IFAE", "MyDigitalSchool",
    "Institut F2I", "L'École Française", "École de l'Excellence Commerciale", "NEXA Digital School",
    "Icademie", "IMC Alternance", "FUTURAE", "EFHT", "Consortio", "Jump", "CBS Paris",
    "SUP'DE COM", "MBWAY", "IPAC BACHELOR", "IFFP", "Immersia", "SKILLIE", "EMCD",
    "ISIFA", "ED'UP", "IEFT", "Mon-Campus", "Studency",
    # Motifs génériques : tout nom d'école, de CFA ou de campus.
    "School", "CFA", "École", "Ecole", "Campus",
]

[labonnealternance]
# Utilisé seulement si search.sites contient "labonnealternance". Clé d'API : LBA_API_KEY dans .env.
# L'API cherche par métier (code ROME), pas par mots-clés. Liste des codes :
# https://www.francetravail.fr/candidat/decouvrir-le-marche-du-travail/les-fiches-metiers.html
romes = []                  # ex. ["E1103", "M1705"] (communication, marketing)
departements = []           # ex. ["75", "92", "93", "94"] ; vide : toute la France

[answers]
# Réponses aux questions complémentaires des recruteurs (listes déroulantes et champs libres).
# Une réponse vide (ou un salaire à 0) laisse la question sans réponse : l'offre
# passe alors en needs_review au lieu de recevoir une réponse inventée.
civility = "Madame"
availability = "immédiate"
# Salaire brut mensuel visé. Sert à choisir la tranche de salaire proposée.
# En alternance, le minimum légal dépend de l'âge et de l'année de formation
# (service-public.gouv.fr). Exemple : 100 % du SMIC brut, 1 867,02 €/mois en 2026.
salary_monthly = 0          # ex. 1867.02
salary_text = ""            # ex. "100 % du SMIC"
# Numéro donné aux recruteurs qui le demandent. Vide : ces offres passent en needs_review.
# Obligatoire avec La bonne alternance, dont le formulaire l'exige.
phone = ""                  # ex. "06 12 34 56 78"

[llm]
# Agent qui note les offres et rédige les lettres : "opencode", "claude" (Claude Code)
# ou "codex". Il doit être installé et connecté sur cette machine.
agent = "opencode"
# Modèles essayés dans l'ordre. Liste vide : modèle par défaut de l'agent.
# OpenCode : modèles gratuits (liste : `opencode models`).
# Claude Code : ex. ["sonnet", "haiku"]. Codex : un modèle de votre compte (`/model`).
models = ["opencode/big-pickle", "opencode/mimo-v2.6-flash-free"]

[mail]
# Emails via AgentMail : une confirmation par candidature envoyée ou à vérifier,
# et le récapitulatif de chaque passage. Laisser vide pour
# l'afficher dans le terminal seulement. Clé API : AGENTMAIL_API_KEY dans .env.
inbox = ""                  # ex. candibot@agentmail.to
to = ""
